name: ai_image_generator
description: AI Image Generator - Android app for generating images via multiple AI models.
publish_to: 'none'
version: 2.0.0+12

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # Network
  http: ^1.2.0
  http_parser: ^4.0.0

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  sqflite: ^2.3.0

  # Image
  image_picker: ^1.0.7

  cached_network_image: ^3.3.1

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  fluttertoast: ^8.2.12
  package_info_plus: ^8.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
