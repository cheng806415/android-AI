name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'

      - name: Generate Android platform files
        run: |
          flutter create --project-name ai_image_generator --platforms=android .

      - name: Remove custom fonts (not available in CI)
        run: |
          sed -i '/^  fonts:/,$ d' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Patch Gradle for plugin compatibility
        run: |
          # Fix namespace issue for plugins that don't define it (AGP 8+ compat)
          cat >> android/build.gradle << 'GRADLE_PATCH'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      if (project.android.namespace == null) {
                          def manifest = new File(project.projectDir, 'src/main/AndroidManifest.xml')
                          if (manifest.exists()) {
                              def parsed = new XmlParser().parse(manifest)
                              def packageName = parsed.@package
                              if (packageName) {
                                  project.android.namespace = packageName
                              }
                          }
                      }
                  }
              }
          }
          GRADLE_PATCH

          # Update compileSdkVersion to 35
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-image-generator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
