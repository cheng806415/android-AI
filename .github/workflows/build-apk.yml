name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'

      - name: Generate Android platform files
        run: |
          flutter create --project-name ai_image_generator --platforms=android .

      - name: Add Android internet permission
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Remove custom fonts (not available in CI)
        run: |
          sed -i '/^  fonts:/,$ d' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8+ compatibility
        run: |
          # Fix namespace issue for any plugin missing it (AGP 8+ compat)
          for plugin_dir in android/.symlinks/plugins/*/android; do
            if [ -f "$plugin_dir/build.gradle" ]; then
              if ! grep -q "namespace" "$plugin_dir/build.gradle"; then
                manifest="$plugin_dir/src/main/AndroidManifest.xml"
                if [ -f "$manifest" ]; then
                  pkg=$(grep -oP 'package="\K[^"]+' "$manifest" || true)
                  if [ -n "$pkg" ]; then
                    sed -i "/^android {/a\\    namespace '$pkg'" "$plugin_dir/build.gradle"
                    echo "Patched namespace '$pkg' in $plugin_dir/build.gradle"
                  fi
                fi
              fi
            fi
          done

          # Ensure compileSdkVersion is 35
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-image-generator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
