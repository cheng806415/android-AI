name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'windows/**'
      - 'macos/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86-64
            runner: windows-2022
            build_dir: x64
            flutter_arch: x64
          - platform: macos
            arch: x86-64
            runner: macos-15-intel
            flutter_arch: x64
          - platform: macos
            arch: ARM64
            runner: macos-14
            flutter_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter_arch }}
          cache: true

      - name: Enable desktop target
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            flutter config --enable-windows-desktop
          else
            flutter config --enable-macos-desktop
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build desktop application
        run: flutter build ${{ matrix.platform }} --release

      - name: Verify Windows architecture output
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $releaseDir = "build\windows\${{ matrix.build_dir }}\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory was not found: $releaseDir"
          }
          if (-not (Get-ChildItem -Path $releaseDir -File -Recurse)) {
            throw "Windows release directory is empty: $releaseDir"
          }

      - name: Verify macOS application
        if: matrix.platform == 'macos'
        run: test -d "build/macos/Build/Products/Release/ai_image_generator.app"

      - name: Package Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $releaseDir = "build\windows\${{ matrix.build_dir }}\runner\Release\*"
          $archive = "build\ai-image-generator-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path $releaseDir -DestinationPath $archive

      - name: Package macOS application
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/ai_image_generator.app" "build/ai-image-generator-macos-${{ matrix.arch }}.zip"

      - name: Generate checksum
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            sha256sum "build/ai-image-generator-windows-${{ matrix.arch }}.zip" > "build/ai-image-generator-windows-${{ matrix.arch }}.sha256"
          else
            shasum -a 256 "build/ai-image-generator-macos-${{ matrix.arch }}.zip" > "build/ai-image-generator-macos-${{ matrix.arch }}.sha256"
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-image-generator-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/*.zip
            build/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ai-image-generator-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AI 图片生成器 2.0.0 Desktop" \
            --notes "桌面端 2.0.0 发布\n\n- Windows x86-64（AMD64）\n- macOS Intel（x86-64）\n- macOS Apple Silicon（ARM64）\n- Windows ARM64 不提供支持\n- Linux 暂不开发"
